
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Bento Gallery</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #111;
    }

    .gallery {
      height: 100dvh;
      padding: 8px;
    }

    .bento-grid {
      height: 100%;
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      grid-template-rows: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }

    .photo {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border-radius: 12px;
      background: #242424;
    }

    .photo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .45s ease;
    }

    .p1  { grid-area: 1 / 1 / 3 / 3; }
    .p2  { grid-area: 1 / 3 / 3 / 4; }
    .p3  { grid-area: 1 / 4 / 2 / 6; }
    .p4  { grid-area: 1 / 6 / 1 / 7; }
    .p5  { grid-area: 2 / 4 / 3 / 5; }
    .p6  { grid-area: 2 / 5 / 3 / 7; }
    .p7  { grid-area: 3 / 1 / 4 / 3; }
    .p8  { grid-area: 3 / 3 / 5 / 5; }
    .p9  { grid-area: 3 / 5 / 4 / 6; }
    .p10 { grid-area: 3 / 6 / 5 / 7; }
    .p11 { grid-area: 4 / 1 / 6 / 2; }
    .p12 { grid-area: 4 / 2 / 5 / 3; }
    .p13 { grid-area: 5 / 2 / 6 / 4; }
    .p14 { grid-area: 5 / 4 / 6 / 5; }
    .p15 { grid-area: 4 / 5 / 6 / 6; }
    .p16 { grid-area: 5 / 6 / 6 / 7; }


    @media (max-width: 767.98px) {
      .gallery {
        padding: 5px;
      }

      .bento-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-template-rows: repeat(8, minmax(0, 1fr));
        gap: 5px;
      }

      .photo {
        border-radius: 8px;
      }

      .p1  { grid-area: 1 / 1 / 3 / 3; }
      .p2  { grid-area: 1 / 3 / 2 / 4; }
      .p3  { grid-area: 2 / 3 / 4 / 4; }
      .p4  { grid-area: 3 / 1 / 4 / 2; }
      .p5  { grid-area: 3 / 2 / 4 / 3; }
      .p6  { grid-area: 4 / 1 / 6 / 2; }
      .p7  { grid-area: 4 / 2 / 6 / 4; }
      .p8  { grid-area: 6 / 1 / 7 / 3; }
      .p9  { grid-area: 6 / 3 / 8 / 4; }
      .p10 { grid-area: 7 / 1 / 9 / 2; }
      .p11 { grid-area: 7 / 2 / 8 / 3; }
      .p12 { grid-area: 8 / 2 / 9 / 4; }

      .p13, .p14, .p15, .p16,
      .p17, .p18, .p19, .p20 {
        display: none;
      }
    }
  </style>
</head>

<body>
  <main class="container-fluid gallery">
    <div class="bento-grid">

      <div class="photo p1">
        <img src="1.jpg" alt="">
      </div>

      <div class="photo p2">
        <img src="2.jpg" alt="">
      </div>

      <div class="photo p3">
        <img src="3.jpg" alt="">
      </div>

      <div class="photo p4">
        <img src="4.jpg" alt="">
      </div>

      <div class="photo p5">
        <img src="5.jpg" alt="">
      </div>

      <div class="photo p6">
        <img src="6.jpg" alt="">
      </div>

      <div class="photo p7">
        <img src="7.jpg" alt="">
      </div>

      <div class="photo p8">
        <img src="8.jpg" alt="">
      </div>

      <div class="photo p9">
        <img src="9.jpg" alt="">
      </div>

      <div class="photo p10">
        <img src="10.jpg" alt="">
      </div>

      <div class="photo p11">
        <img src="11.jpg" alt="">
      </div>

      <div class="photo p12">
        <img src="12.jpg" alt="">
      </div>

      <div class="photo p13">
        <img src="13.jpg" alt="">
      </div>

      <div class="photo p14">
        <img src="14.jpg" alt="">
      </div>

      <div class="photo p15">
        <img src="15.jpg" alt="">
      </div>

      <div class="photo p16">
        <img src="16.jpg" alt="">
      </div>


    </div>
  </main>
</body>
</html>
